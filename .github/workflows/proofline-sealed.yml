name: Proofline sealed staging tests
on:
  push:
    paths:
      - "proofline-stage/**"
      - ".github/workflows/proofline-sealed.yml"
  pull_request:
    paths:
      - "proofline-stage/**"
      - ".github/workflows/proofline-sealed.yml"
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s proofline-stage -p 'test_*.py' -v
  identity-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test proofline-stage/supabase/proofline-staging-auth/policy.test.mjs
